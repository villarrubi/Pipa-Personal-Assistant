[platformio]
default_envs = waveshare-185c
boards_dir = boards

[env:waveshare-185c]
platform = espressif32@7.0.1
board = waveshare-esp32-s3-touch-lcd-185c
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    rweather/Crypto@0.4.0
