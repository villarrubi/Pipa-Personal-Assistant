[platformio]
default_envs = waveshare-185c
boards_dir = boards

[env:waveshare-185c]
; The Waveshare ST77916 example needs the modern esp_lcd QSPI API. The
; pioarduino platform packages Arduino-ESP32 3.3.11 and IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = waveshare-esp32-s3-touch-lcd-185c
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    rweather/Crypto@0.4.0

[env:waveshare-185c-v1]
extends = env:waveshare-185c
build_flags =
    ${env:waveshare-185c.build_flags}
    -DPIPA_BOARD_REVISION=1

[env:secure-session-vector]
extends = env:waveshare-185c
build_flags =
    ${env:waveshare-185c.build_flags}
    -DPIPA_SECURE_SESSION_VECTOR_TEST=1

[env:secure-session-v2]
extends = env:waveshare-185c
build_flags =
    ${env:waveshare-185c.build_flags}
    -DPIPA_SECURE_SESSION_ENABLED=1

; Production voice path for a provisioned V2 board. Audio is accepted only
; inside the encrypted v2 session and remains disabled in every other build.
[env:voice-v2]
extends = env:waveshare-185c
build_flags =
    ${env:waveshare-185c.build_flags}
    -DPIPA_SECURE_SESSION_ENABLED=1
    -DPIPA_AUDIO_CAPTURE_ENABLED=1

; Explicit opt-in build: local VAD monitors the microphones, starts an
; encrypted utterance automatically and ends it after trailing silence.
[env:voice-v2-handsfree]
extends = env:voice-v2
build_flags =
    ${env:voice-v2.build_flags}
    -DPIPA_ALWAYS_LISTENING_ENABLED=1

; Compile-only SDK and V2 pin-map probe. It is deliberately not used by main,
; never reads/writes samples, and is not a production firmware environment.
[env:audio-i2s-lab]
extends = env:waveshare-185c
build_flags =
    ${env:waveshare-185c.build_flags}
    -DPIPA_AUDIO_I2S_LAB=1
