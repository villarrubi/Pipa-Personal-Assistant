name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python and repository checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r windows-agent/requirements.txt ruff==0.16.0
      - name: Lint Python
        run: ruff check backend windows-agent scripts
      - name: Check Python formatting
        run: ruff format --check backend windows-agent scripts
      - name: Compile Python modules
        run: python -m compileall -q backend windows-agent scripts
      - name: Check PowerShell syntax
        shell: pwsh
        run: ./scripts/check_powershell_syntax.ps1
      - name: Check workflow action pins
        shell: pwsh
        run: ./scripts/check_workflow_security.ps1
      - name: Check CI coverage
        shell: pwsh
        run: ./scripts/check_ci_coverage.ps1
      - name: Check agent startup lifecycle
        shell: pwsh
        run: ./scripts/check_agent_startup.ps1
      - name: Check log safety
        shell: pwsh
        run: ./scripts/check_log_safety.ps1
      - name: Check firmware log safety
        shell: pwsh
        run: ./scripts/check_firmware_log_safety.ps1
      - name: Check iOS package structure
        shell: pwsh
        run: ./scripts/check_mobile_ios_package.ps1
      - name: Check mobile confirmation contract
        run: python scripts/check_mobile_confirmation_contract.py
      - name: Check Waveshare V1/V2 pin map
        shell: pwsh
        run: ./scripts/check_waveshare_pinmap.ps1
      - name: Check firmware configuration safety
        shell: pwsh
        run: ./scripts/check_firmware_config.ps1
      - name: Check firmware flashing safety
        shell: pwsh
        run: ./scripts/check_firmware_flash_safety.ps1
      - name: Check firmware security gate
        shell: pwsh
        run: ./scripts/check_firmware_security_gate.ps1
      - name: Check audio I2S lab safety
        shell: pwsh
        run: ./scripts/check_audio_i2s_lab.ps1
      - name: Check secure audio contract isolation
        shell: pwsh
        run: ./scripts/check_secure_audio_contract.ps1
      - name: Check audio state machine isolation
        shell: pwsh
        run: ./scripts/check_audio_state_machine.ps1
      - name: Check display text isolation
        shell: pwsh
        run: ./scripts/check_display_text.ps1
      - name: Check Trusted Unlock safety
        shell: pwsh
        run: ./scripts/check_trusted_unlock_safety.ps1
      - name: Run pre-hardware integration gate
        shell: pwsh
        run: ./scripts/check_pre_hardware.ps1 -SkipResidentAgent
      - name: Run backend tests
        run: python -B -m unittest discover -s backend/tests -p "test_*.py"
      - name: Run Windows Agent tests
        run: python -B -m unittest discover -s windows-agent/tests -p "test_*.py"
      - name: Check repository hygiene
        shell: pwsh
        run: ./scripts/check_repo_hygiene.ps1
      - name: Check complete Git history
        shell: pwsh
        run: ./scripts/check_git_history.ps1
      - name: Test secret pattern contract
        shell: pwsh
        run: ./scripts/test_security_patterns.ps1

  firmware-build:
    name: Firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run audio state host vector
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            firmware/src/pipa_audio_state.cpp \
            firmware/tests/pipa_audio_state_host_test.cpp \
            -o /tmp/pipa_audio_state_host_test
          /tmp/pipa_audio_state_host_test
      - name: Run firmware input policy host test
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/tests/pipa_text_policy_host_test.cpp \
            -o /tmp/pipa_text_policy_host_test
          /tmp/pipa_text_policy_host_test
      - name: Run display text host test
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/src/pipa_display_text.cpp \
            firmware/tests/pipa_display_text_host_test.cpp \
            -o /tmp/pipa_display_text_host_test
          /tmp/pipa_display_text_host_test
      - name: Run Wake-on-LAN packet host test
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/src/wake_on_lan_packet.cpp \
            firmware/tests/wake_on_lan_packet_host_test.cpp \
            -o /tmp/wake_on_lan_packet_host_test
          /tmp/wake_on_lan_packet_host_test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile Waveshare firmware
        shell: bash
        run: |
          set -euo pipefail

          run_pio_with_retry() {
            local environment="$1"
            local attempt

            for attempt in 1 2 3; do
              echo "PlatformIO: entorno ${environment}, intento ${attempt}/3"
              if pio run -d firmware -e "${environment}"; then
                return 0
              fi

              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done

            echo "PlatformIO: el entorno ${environment} ha fallado tras 3 intentos" >&2
            return 1
          }

          run_pio_with_retry waveshare-185c
          run_pio_with_retry waveshare-185c-v1
          run_pio_with_retry secure-session-v2
          run_pio_with_retry secure-session-vector
          run_pio_with_retry audio-i2s-lab

  swift-package:
    name: Swift mobile core tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test PipaMobileCore
        run: swift test --package-path mobile-ios
      - name: Build iOS app project without signing
        run: xcodebuild -project mobile-ios/PipaMobileApp/PipaMobile.xcodeproj -scheme PipaMobile -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  credential-provider-build:
    name: Credential Provider smoke test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure x64 build
        run: cmake -S trusted-unlock -B trusted-unlock/build-ci -A x64
      - name: Build Release
        run: cmake --build trusted-unlock/build-ci --config Release
      - name: Run smoke test
        run: .\trusted-unlock\build-ci\Release\PipaProviderTest.exe

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: windows-agent/requirements.txt
