name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python and repository checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r windows-agent/requirements.txt ruff==0.16.0
      - name: Lint Python
        run: ruff check backend windows-agent
      - name: Check Python formatting
        run: ruff format --check backend windows-agent
      - name: Compile Python modules
        run: python -m compileall -q backend windows-agent
      - name: Check PowerShell syntax
        shell: pwsh
        run: ./scripts/check_powershell_syntax.ps1
      - name: Check agent startup lifecycle
        shell: pwsh
        run: ./scripts/check_agent_startup.ps1
      - name: Check iOS package structure
        shell: pwsh
        run: ./scripts/check_mobile_ios_package.ps1
      - name: Check Waveshare V1/V2 pin map
        shell: pwsh
        run: ./scripts/check_waveshare_pinmap.ps1
      - name: Check firmware configuration safety
        shell: pwsh
        run: ./scripts/check_firmware_config.ps1
      - name: Check Trusted Unlock safety
        shell: pwsh
        run: ./scripts/check_trusted_unlock_safety.ps1
      - name: Run pre-hardware integration gate
        shell: pwsh
        run: ./scripts/check_pre_hardware.ps1 -SkipResidentAgent
      - name: Run backend tests
        run: python -B -m unittest discover -s backend/tests -p "test_*.py"
      - name: Run Windows Agent tests
        run: python -B -m unittest discover -s windows-agent/tests -p "test_*.py"
      - name: Check repository hygiene
        shell: pwsh
        run: ./scripts/check_repo_hygiene.ps1
      - name: Check complete Git history
        shell: pwsh
        run: ./scripts/check_git_history.ps1

  firmware-build:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile Waveshare firmware
        run: pio run -d firmware -e waveshare-185c
      - name: Compile V1 compatibility map
        run: pio run -d firmware -e waveshare-185c-v1
      - name: Compile secure session variant
        run: pio run -d firmware -e secure-session-v2
      - name: Compile deterministic secure-session vector
        run: pio run -d firmware -e secure-session-vector

  swift-package:
    name: Swift mobile core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test PipaMobileCore
        run: swift test --package-path mobile-ios

  credential-provider-build:
    name: Credential Provider smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure x64 build
        run: cmake -S trusted-unlock -B trusted-unlock/build-ci -A x64
      - name: Build Release
        run: cmake --build trusted-unlock/build-ci --config Release
      - name: Run smoke test
        run: .\trusted-unlock\build-ci\Release\PipaProviderTest.exe

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: windows-agent/requirements.txt
